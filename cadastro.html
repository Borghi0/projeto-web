<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/form.css">
    <title>Cadastro</title>
</head>
<body>
    <main>
        <section>
            <h1>Cadastro de Usuário</h1>

            <form action="login.html">
                <label for="name">Nome:</label><br>
                <input type="text" id="name" name="name" placeholder="Seu nome" required>
                <br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" placeholder="exemplo@mail.com" required>
                <br><br>

                <label for="birth-date">Data de nascimento:</label><br>
                <input type="date" id="birth-date" name="birth-date" required>
                <br><br>

                <label for="pwd">Senha:</label><br>
                <input type="password" id="pwd" name="pwd" required>
                <br><br>

                <label for="cpwd">Confirmar senha:</label><br>
                <input type="password" id="cpwd" name="cpwd" required>
                <br><br>

                <input class="btn" type="submit" value="Cadastrar-se">
            </form>

        </section>
    </main>
</body>
</html>
